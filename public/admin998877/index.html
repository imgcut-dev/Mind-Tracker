<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4a154b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>관리자 · 지금 마음에 필요한 책 한 권</title>
<style>
  :root { --brand: #4a154b; --bg: #f7f4f8; --ink: #1d1b20; --sub: #625b71; --line: #cac4d0; --err: #b3261e; --ok: #1b6e3c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  h2 { margin: 0; font-size: 18px; }
  p { margin: 0 0 16px; color: var(--sub); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  button { font: inherit; cursor: pointer; border-radius: 999px; padding: 10px 20px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.danger { color: var(--err); }
  button.small { padding: 6px 14px; font-size: 13px; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin: 12px 0 0; min-height: 1.5em; color: var(--err); }
  .msg.ok { color: var(--ok); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  header span { color: var(--sub); font-size: 13px; word-break: break-all; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .menu li { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--sub); }
  .menu li.on { color: var(--ink); cursor: pointer; font-weight: 600; }
  .menu li.on:hover { border-color: var(--brand); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .bar div { display: flex; gap: 8px; flex-wrap: wrap; }
  .books li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; }
  .books .t { font-weight: 600; }
  .books .m { color: var(--sub); font-size: 13px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #e8def8; color: var(--brand); margin-left: 6px; }
  .badge.draft { background: #eee; color: var(--sub); }
  .acts { display: flex; gap: 6px; flex-shrink: 0; }
  dialog { border: 0; border-radius: 16px; padding: 24px; width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--sub); }
  input[type=text], input[type=number], textarea, select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  textarea { min-height: 72px; resize: vertical; }
  .emos { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .emos label { display: flex; align-items: center; gap: 4px; margin: 0; color: var(--ink); font-size: 14px; }
  .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login" class="card" hidden>
    <h1>관리자 로그인</h1>
    <p>등록된 관리자 계정만 들어올 수 있습니다.</p>
    <button id="go" class="primary" type="button">Google로 로그인</button>
    <p id="msg" class="msg" role="alert"></p>
  </section>

  <section id="checking" class="card"><p style="margin:0">권한을 확인하는 중…</p></section>

  <section id="dash" hidden>
    <header>
      <div><h1 style="margin:0">관리자</h1><span id="who"></span></div>
      <button id="out" type="button">로그아웃</button>
    </header>

    <div id="home" class="card">
      <ul class="menu">
        <li>Gemini API 연동 관리 <small>준비 중</small></li>
        <li>API 키 등록·관리 <small>준비 중</small></li>
        <li>감정 구슬 추가 등록 <small>준비 중</small></li>
        <li id="openBooks" class="on">추천 책 DB <small>관리하기 →</small></li>
        <li>쇼핑몰 연동 관리 <small>준비 중</small></li>
      </ul>
    </div>

    <div id="books" class="card" hidden>
      <div class="bar">
        <button id="backHome" class="small" type="button">← 메뉴</button>
        <div>
          <button id="seedBtn" class="small" type="button" hidden>기본 책 30권 가져오기</button>
          <button id="addBtn" class="small primary" type="button">+ 책 추가</button>
        </div>
      </div>
      <h2 id="booksTitle">추천 책 DB</h2>
      <p id="bmsg" class="msg" role="status"></p>
      <ul id="bookList" class="books"></ul>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">책 추가</h2>
    <label for="f-title">제목 *</label><input id="f-title" type="text" maxlength="100" required>
    <label for="f-author">저자 *</label><input id="f-author" type="text" maxlength="100" required>
    <label for="f-genre">분야</label><input id="f-genre" type="text" maxlength="50" placeholder="예: 소설, 에세이, 심리">
    <label for="f-year">처음 출간된 연도</label><input id="f-year" type="number" min="1000" max="2100">
    <label for="f-intro">책 소개 (2문장 이내)</label><textarea id="f-intro" maxlength="500"></textarea>
    <label for="f-for">이런 분께</label><input id="f-for" type="text" maxlength="200">
    <label for="f-keywords">키워드 (쉼표로 구분, 3개 이하)</label><input id="f-keywords" type="text" maxlength="100">
    <label for="f-reasons">추천 이유 (한 줄에 하나씩)</label><textarea id="f-reasons" maxlength="1000"></textarea>
    <label>어울리는 감정</label><div id="emos" class="emos"></div>
    <label for="f-status">상태</label>
    <select id="f-status"><option value="published">공개</option><option value="draft">초안(숨김)</option></select>
    <p id="fmsg" class="msg" role="alert"></p>
    <div class="foot">
      <button id="cancel" type="button">취소</button>
      <button id="save" class="primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, addDoc, setDoc, deleteDoc, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 웹 설정값은 공개돼도 되는 식별자다. 접근 제어는 Firestore 보안 규칙이 한다.
const app = initializeApp({
  apiKey: "AIzaSyCMMNCVcOpL0xtZR0sTNcHxdvWcnZaasRo",
  authDomain: "mind-tracker-main.firebaseapp.com",
  projectId: "mind-tracker-main",
  appId: "1:1080860285555:web:6fb137add8f8d64f242806"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

// ponytail: 감정 목록은 고정 10개. 감정 구슬 관리 화면이 생기면 거기서 읽어 온다.
const EMOTIONS = ["외로움", "불안", "우울", "분노", "번아웃", "설렘", "슬픔", "후회", "무기력", "기쁨"];

/* ---------- 로그인 ---------- */
function show(name) {
  for (const id of ["login", "checking", "dash"]) $(id).hidden = id !== name;
}
function setMsg(el, text, ok) { el.textContent = text; el.classList.toggle("ok", !!ok); }

// 허용 목록 = Firestore admins/{이메일(소문자)} 문서가 있는가
// ponytail: 화면 판정은 안내용이다. 실제 차단은 보안 규칙이 하므로 관리자 데이터는 반드시 규칙으로 막는다.
async function checkAdmin(user) {
  if (!user.email || !user.emailVerified) return "no";
  try {
    // Firestore가 없거나 연결이 안 되면 getDoc은 오류 없이 재시도만 하므로 시간 제한을 둔다.
    const snap = await Promise.race([
      getDoc(doc(db, "admins", user.email.toLowerCase())),
      new Promise((_, reject) => setTimeout(() => reject({ code: "timeout: Firestore 데이터베이스가 만들어졌는지 확인하세요" }), 8000))
    ]);
    return snap.exists() ? "yes" : "no";
  } catch (e) {
    console.error(e);
    return "error:" + (e.code || e.message);
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return show("login");
  show("checking");
  const result = await checkAdmin(user);
  if (result === "yes") {
    $("who").textContent = user.email;
    return show("dash");
  }
  const email = user.email;
  await signOut(auth);
  setMsg($("msg"), result === "no"
    ? email + " 계정은 관리자로 등록되어 있지 않습니다."
    : "권한을 확인하지 못했습니다. (" + result + ")");
  show("login");
});

$("go").addEventListener("click", async () => {
  setMsg($("msg"), "");
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      setMsg($("msg"), "로그인에 실패했습니다. (" + (e.code || e.message) + ")");
    }
  }
});
$("out").addEventListener("click", () => signOut(auth));

/* ---------- 추천 책 DB ---------- */
const booksCol = collection(db, "books");
let books = []; // [{id, ...data}]

$("openBooks").addEventListener("click", () => { $("home").hidden = true; $("books").hidden = false; loadBooks(); });
$("backHome").addEventListener("click", () => { $("books").hidden = true; $("home").hidden = false; });

async function loadBooks() {
  setMsg($("bmsg"), "불러오는 중…");
  try {
    const snap = await getDocs(booksCol);
    books = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    books.sort((a, b) => a.title.localeCompare(b.title, "ko"));
    renderBooks();
    setMsg($("bmsg"), "");
  } catch (e) {
    console.error(e);
    setMsg($("bmsg"), "책 목록을 불러오지 못했습니다. (" + (e.code || e.message) + ")");
  }
}

function renderBooks() {
  $("booksTitle").textContent = "추천 책 DB (" + books.length + "권)";
  $("seedBtn").hidden = books.length > 0;
  const ul = $("bookList");
  ul.replaceChildren();
  for (const b of books) {
    const li = document.createElement("li");
    const info = document.createElement("div");
    const t = document.createElement("div");
    t.className = "t";
    t.textContent = b.title;
    const badge = document.createElement("span");
    badge.className = "badge" + (b.status === "draft" ? " draft" : "");
    badge.textContent = b.status === "draft" ? "초안" : "공개";
    t.append(badge);
    const m = document.createElement("div");
    m.className = "m";
    m.textContent = b.author + " · " + (b.emotions || []).join(", ");
    info.append(t, m);
    const acts = document.createElement("div");
    acts.className = "acts";
    const edit = document.createElement("button");
    edit.type = "button"; edit.className = "small"; edit.textContent = "수정";
    edit.addEventListener("click", () => openForm(b));
    const del = document.createElement("button");
    del.type = "button"; del.className = "small danger"; del.textContent = "삭제";
    del.addEventListener("click", () => removeBook(b));
    acts.append(edit, del);
    li.append(info, acts);
    ul.append(li);
  }
}

async function removeBook(b) {
  if (!confirm("'" + b.title + "'을(를) 삭제할까요? 되돌릴 수 없습니다.")) return;
  try {
    await deleteDoc(doc(db, "books", b.id));
    await loadBooks();
  } catch (e) {
    setMsg($("bmsg"), "삭제하지 못했습니다. (" + (e.code || e.message) + ")");
  }
}

// 기본 책 가져오기: 컬렉션이 비어 있을 때만 보인다. 500건 제한 안이라 한 번에 쓴다.
$("seedBtn").addEventListener("click", async () => {
  $("seedBtn").disabled = true;
  setMsg($("bmsg"), "가져오는 중…");
  try {
    const seed = await (await fetch("./seed-books.json")).json();
    const batch = writeBatch(db);
    for (const b of seed) {
      batch.set(doc(booksCol), { ...b, createdAt: serverTimestamp(), updatedAt: serverTimestamp(), updatedBy: auth.currentUser.email });
    }
    await batch.commit();
    await loadBooks();
    setMsg($("bmsg"), seed.length + "권을 가져왔습니다.", true);
  } catch (e) {
    console.error(e);
    setMsg($("bmsg"), "가져오지 못했습니다. (" + (e.code || e.message) + ")");
  } finally {
    $("seedBtn").disabled = false;
  }
});

/* ---------- 등록·수정 폼 ---------- */
let editingId = null;
for (const name of EMOTIONS) {
  const l = document.createElement("label");
  const c = document.createElement("input");
  c.type = "checkbox"; c.value = name;
  l.append(c, name);
  $("emos").append(l);
}

function openForm(b) {
  editingId = b ? b.id : null;
  $("dlgTitle").textContent = b ? "책 수정" : "책 추가";
  $("f-title").value = b?.title ?? "";
  $("f-author").value = b?.author ?? "";
  $("f-genre").value = b?.genre ?? "";
  $("f-year").value = b?.year ?? "";
  $("f-intro").value = b?.intro ?? "";
  $("f-for").value = b?.forWhom ?? "";
  $("f-keywords").value = (b?.keywords ?? []).join(", ");
  $("f-reasons").value = (b?.reasons ?? []).join("\n");
  $("f-status").value = b?.status ?? "published";
  for (const c of $("emos").querySelectorAll("input")) c.checked = (b?.emotions ?? []).includes(c.value);
  setMsg($("fmsg"), "");
  $("dlg").showModal();
}
$("addBtn").addEventListener("click", () => openForm(null));
$("cancel").addEventListener("click", () => $("dlg").close());

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const emotions = [...$("emos").querySelectorAll("input:checked")].map((c) => c.value);
  if (!emotions.length) return setMsg($("fmsg"), "어울리는 감정을 하나 이상 선택하세요.");
  const year = $("f-year").value ? Number($("f-year").value) : null;
  const data = {
    title: $("f-title").value.trim(),
    author: $("f-author").value.trim(),
    genre: $("f-genre").value.trim(),
    year,
    intro: $("f-intro").value.trim(),
    forWhom: $("f-for").value.trim(),
    keywords: $("f-keywords").value.split(",").map((s) => s.trim()).filter(Boolean).slice(0, 3),
    reasons: $("f-reasons").value.split("\n").map((s) => s.trim()).filter(Boolean),
    emotions,
    status: $("f-status").value,
    updatedAt: serverTimestamp(),
    updatedBy: auth.currentUser.email
  };
  // 같은 제목+저자가 이미 있으면 막는다(수정 중인 책은 제외).
  if (books.some((b) => b.id !== editingId && b.title === data.title && b.author === data.author)) {
    return setMsg($("fmsg"), "같은 제목·저자의 책이 이미 있습니다.");
  }
  $("save").disabled = true;
  try {
    if (editingId) await setDoc(doc(db, "books", editingId), data, { merge: true });
    else await addDoc(booksCol, { ...data, createdAt: serverTimestamp() });
    $("dlg").close();
    await loadBooks();
    setMsg($("bmsg"), "저장했습니다.", true);
  } catch (e) {
    console.error(e);
    setMsg($("fmsg"), "저장하지 못했습니다. (" + (e.code || e.message) + ")");
  } finally {
    $("save").disabled = false;
  }
});
</script>
</body>
</html>
