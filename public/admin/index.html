<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4a154b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>관리자 · 지금 마음에 필요한 책 한 권</title>
<style>
  :root { --brand: #4a154b; --bg: #f7f4f8; --ink: #1d1b20; --sub: #625b71; --line: #cac4d0; --err: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 16px; color: var(--sub); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  button { font: inherit; cursor: pointer; border-radius: 999px; padding: 12px 24px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { margin: 16px 0 0; color: var(--err); min-height: 1.5em; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  header span { color: var(--sub); font-size: 13px; word-break: break-all; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; justify-content: space-between; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--sub); }
  li small { color: var(--sub); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login" class="card" hidden>
    <h1>관리자 로그인</h1>
    <p>등록된 관리자 계정만 들어올 수 있습니다.</p>
    <button id="go" class="primary" type="button">Google로 로그인</button>
    <p id="msg" role="alert"></p>
  </section>

  <section id="checking" class="card"><p style="margin:0">권한을 확인하는 중…</p></section>

  <section id="dash" hidden>
    <header>
      <div><h1 style="margin:0">관리자</h1><span id="who"></span></div>
      <button id="out" type="button">로그아웃</button>
    </header>
    <div class="card">
      <ul>
        <li>Gemini API 연동 관리 <small>준비 중</small></li>
        <li>API 키 등록·관리 <small>준비 중</small></li>
        <li>감정 구슬 추가 등록 <small>준비 중</small></li>
        <li>추천 책 DB <small>준비 중</small></li>
        <li>쇼핑몰 연동 관리 <small>준비 중</small></li>
      </ul>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 웹 설정값은 공개돼도 되는 식별자다. 접근 제어는 Firestore 보안 규칙이 한다.
const app = initializeApp({
  apiKey: "AIzaSyCMMNCVcOpL0xtZR0sTNcHxdvWcnZaasRo",
  authDomain: "mind-tracker-main.firebaseapp.com",
  projectId: "mind-tracker-main",
  appId: "1:1080860285555:web:6fb137add8f8d64f242806"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

function show(name) {
  for (const id of ["login", "checking", "dash"]) $(id).hidden = id !== name;
}
function msg(text) { $("msg").textContent = text; }

// 허용 목록 = Firestore admins/{이메일(소문자)} 문서가 있는가
// ponytail: 화면 판정은 안내용이다. 실제 차단은 보안 규칙이 하므로 관리자 데이터는 반드시 규칙으로 막는다.
async function checkAdmin(user) {
  if (!user.email || !user.emailVerified) return "no";
  try {
    return (await getDoc(doc(db, "admins", user.email.toLowerCase()))).exists() ? "yes" : "no";
  } catch (e) {
    console.error(e);
    return "error:" + (e.code || e.message);
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return show("login");
  show("checking");
  const result = await checkAdmin(user);
  if (result === "yes") {
    $("who").textContent = user.email;
    return show("dash");
  }
  const email = user.email;
  await signOut(auth);
  msg(result === "no"
    ? email + " 계정은 관리자로 등록되어 있지 않습니다."
    : "권한을 확인하지 못했습니다. (" + result + ")");
  show("login");
});

$("go").addEventListener("click", async () => {
  msg("");
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      msg("로그인에 실패했습니다. (" + (e.code || e.message) + ")");
    }
  }
});
$("out").addEventListener("click", () => signOut(auth));
</script>
</body>
</html>
